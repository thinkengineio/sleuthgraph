# Dev override. Mounts source code into api and web containers for hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    volumes:
      - ../../sleuthgraph-api/src:/app/src
      - ../../sleuthgraph-api/alembic:/app/alembic
      - ../../sleuthgraph-api/alembic.ini:/app/alembic.ini
      - ../../sleuthgraph-api/tests:/app/tests
    command: uvicorn sleuthgraph.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    volumes:
      - ../../sleuthgraph-web/app:/app/app
      - ../../sleuthgraph-web/components:/app/components
      - ../../sleuthgraph-web/lib:/app/lib
      - ../../sleuthgraph-web/public:/app/public
      - ../../sleuthgraph-web/next.config.ts:/app/next.config.ts
      - ../../sleuthgraph-web/tailwind.config.ts:/app/tailwind.config.ts
    command: pnpm dev
