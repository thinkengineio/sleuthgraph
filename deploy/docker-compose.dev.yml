# Dev override. Mounts source code into api container for hot reload.
#
# Web runs in production mode (standalone node server) inside Docker.
# For web hot reload during development, run `pnpm dev` OUTSIDE the container
# and skip the `web` service: docker compose up -d db redis minio api

services:
  api:
    volumes:
      - ../../sleuthgraph-api/src:/app/src
      - ../../sleuthgraph-api/alembic:/app/alembic
      - ../../sleuthgraph-api/alembic.ini:/app/alembic.ini
      - ../../sleuthgraph-api/tests:/app/tests
    command: uvicorn sleuthgraph.main:app --host 0.0.0.0 --port 8000 --reload
